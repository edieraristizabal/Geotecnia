# Configuración del libro (Jupyter Book 1.x)
# https://jupyterbook.org/customize/config.html

title: Geotecnia para geólogos
author: Edier V. Aristizábal G.
email: edieraristizabal@gmail.com
copyright: "2026"
logo: images/logo.png
only_build_toc_files: true

execute:
  execute_notebooks: "off"

latex:
  latex_documents:
    targetname: Geotecnia_libro.tex

bibtex_bibfiles:
  - references.bib

sphinx:
  config:
    bibtex_reference_style: author_year
    language: es
    html_show_copyright: true

repository:
  url: https://github.com/edieraristizabal/Geotecnia
  path_to_book: libro
  branch: main

html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  home_page_in_navbar: true
  baseurl: https://edieraristizabal.github.io/Geotecnia/libro/
  extra_footer: |
    <p>Desarrollado por <a href="https://github.com/edieraristizabal">Edier Aristizábal</a>, Facultad de Minas, Universidad Nacional de Colombia.
    <a href="https://edieraristizabal.github.io/Geotecnia/">Página del curso</a> ·
    <a href="https://edieraristizabal.github.io/Geotecnia/html/Geotecnia.html">Diapositivas</a></p>
  comments:
    hypothesis: true

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist
